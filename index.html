<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkey road trip, 8–18 October</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FAFAF7; --panel:#FFFFFF; --ink:#1B2430; --ink-2:#4D5A6A; --ink-3:#8793A2;
  --line:#E3E6E8; --sea:#CFE3E6; --sea-deep:#B7D6DA; --land:#F1EDE2; --land-edge:#CFC7B5;
  --route:#1E3F8A; --route-dim:#B9C3DE; --train:#5B6E9E;
  --must:#B8322E; --worth:#2B8C8C; --opt:#8793A2;
  --deadline-bg:#FBEDEC; --deadline-ink:#8E2522;
  --tab-active:#1E3F8A; --tab-ink:#FFFFFF;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141719; --panel:#1C2023; --ink:#EEF0F2; --ink-2:#B4BCC6; --ink-3:#7E8893;
    --line:#2B3136; --sea:#15323A; --sea-deep:#0F262C; --land:#262B2E; --land-edge:#3A4247;
    --route:#7FA3F0; --route-dim:#36425A; --train:#9DB0D8;
    --must:#F07E79; --worth:#5FC2C2; --opt:#7E8893;
    --deadline-bg:#3A1F1E; --deadline-ink:#F5B5B2;
    --tab-active:#7FA3F0; --tab-ink:#141719;
  }
}
:root[data-theme="dark"]{
  --bg:#141719; --panel:#1C2023; --ink:#EEF0F2; --ink-2:#B4BCC6; --ink-3:#7E8893;
  --line:#2B3136; --sea:#15323A; --sea-deep:#0F262C; --land:#262B2E; --land-edge:#3A4247;
  --route:#7FA3F0; --route-dim:#36425A; --train:#9DB0D8;
  --must:#F07E79; --worth:#5FC2C2; --opt:#7E8893;
  --deadline-bg:#3A1F1E; --deadline-ink:#F5B5B2;
  --tab-active:#7FA3F0; --tab-ink:#141719;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-rows:auto auto 1fr;min-height:100%}
@media (min-width:960px){
  .app{grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);grid-template-rows:auto 1fr;height:100%}
  header{grid-column:1/-1}
  .mapwrap{grid-row:2;grid-column:1;position:sticky;top:0;align-self:start;height:calc(100vh - 64px);display:flex;flex-direction:column}
  .panel{grid-row:2;grid-column:2;border-left:1px solid var(--line)}
}

header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
header h1 small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink-2);margin-left:10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* one indicator vocabulary, used in legend, schedule and map:
   shape+colour = importance (circle must, diamond worth, square optional); filled = in the plan, hollow = alternative */
.ind{display:inline-block;box-sizing:border-box;flex:none;border:2px solid var(--opt);background:var(--opt)}
.ind.m{width:13px;height:13px;border-radius:50%;border-color:var(--must);background:var(--must)}
.ind.w{width:11px;height:11px;border-radius:2px;transform:rotate(45deg);border-color:var(--worth);background:var(--worth)}
.ind.o{width:10px;height:10px;border-radius:1.5px;border-color:var(--opt);background:var(--opt)}
.ind.alt{background:var(--panel)!important}
.ind.night{width:16px;height:16px;border-radius:50%;border:2px solid var(--route);background:var(--panel);color:var(--route);font:600 9px/12px var(--sans);text-align:center;transform:none}
.ind.town{width:7px;height:7px;border-radius:50%;border:0;background:#4D5A6A}
.ind.line{width:18px;height:0;border:0;border-top:3px solid var(--route);border-radius:0}
.ind.line.train{border-top-style:dashed}

.mapwrap{position:relative;background:var(--sea)}
#map{width:100%;height:58vh;min-height:320px}
@media (min-width:960px){#map{flex:1;height:100%}}
.leaflet-container{font-family:var(--sans);background:var(--sea)}
.mapnote{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);font-style:italic;font-family:var(--serif);z-index:500;background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 6px;border-radius:4px}
.nightpin{width:26px;height:26px;border-radius:50%;background:var(--panel);border:2.5px solid var(--route);color:var(--route);font:600 11px/21px var(--sans);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:all .2s}
.nightpin.active{background:var(--route);border-color:var(--route);color:var(--tab-ink);transform:scale(1.12)}
.poipin{box-sizing:border-box;border:2px solid var(--opt);background:var(--opt);box-shadow:0 1px 2px rgba(0,0,0,.35);opacity:.45;transition:opacity .2s,transform .2s}
.poipin.m{width:15px;height:15px;border-radius:50%;border-color:var(--must);background:var(--must)}
.poipin.w{width:12px;height:12px;border-radius:2px;transform:rotate(45deg);border-color:var(--worth);background:var(--worth)}
.poipin.o{width:11px;height:11px;border-radius:1.5px;border-color:var(--opt);background:var(--opt)}
.poipin.alt{background:var(--panel)}
.poipin.on{opacity:1}
.poipin.on.m{transform:scale(1.2)} .poipin.on.w{transform:rotate(45deg) scale(1.2)} .poipin.on.o{transform:scale(1.2)}
.poipin.all{opacity:.9}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.45;max-width:260px}
.pp-day{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.pp-name{font-weight:600;font-size:14.5px}
.pp-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;color:#fff}
.pp-tag.m{background:var(--must)} .pp-tag.w{background:var(--worth)} .pp-tag.o{background:var(--opt)}
.pp-alt{font-size:11.5px;color:var(--ink-3);font-style:italic}
.pp-d{color:var(--ink-2);margin-top:4px}
.pp-cost{color:var(--ink-3);font-style:italic;font-size:12.5px;margin-top:4px}
.pp-go{margin-top:8px;font-size:12.5px;color:var(--route);text-decoration:none}
.leaflet-control-attribution{font-size:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--bg);position:sticky;top:0;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:74px}
.tab b{font-weight:600;color:var(--ink);font-size:13.5px}
.tab small{font-size:11px;color:var(--ink-3)}
.tab.active{background:var(--tab-active);border-color:var(--tab-active);color:var(--tab-ink)}
.tab.active b,.tab.active small{color:var(--tab-ink)}

.panel{overflow-y:auto;background:var(--panel)}
.day{padding:18px 20px 36px;max-width:680px}
.day h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 2px;letter-spacing:-.01em;line-height:1.15}
.day .sub{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.rt{margin:-8px 0 12px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ovday .rt{display:block;color:var(--ink-3);font-size:12px}
.stay{margin:-6px 0 14px;padding-left:12px;border-left:3px solid var(--worth);color:var(--ink-2);font-size:13.5px;line-height:1.5}
.deadline{background:var(--deadline-bg);color:var(--deadline-ink);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.45;margin-bottom:18px}
.deadline b{font-weight:600}
.slot{display:grid;grid-template-columns:62px 1fr;gap:0 14px;padding:12px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;padding-top:2px;line-height:1.35}
.item{position:relative;padding-left:19px}
.item>.ind{position:absolute;left:1px;top:6px}
.item.w>.ind{left:2px;top:7px} .item.o>.ind{left:2px;top:7px}
.item.n{padding-left:0;color:var(--ink-2)}
.item .name{font-weight:600}
.item .d{color:var(--ink-2);font-size:13.5px}
.item .dur{color:var(--ink-3);font-size:12.5px;margin-left:6px;white-space:nowrap}
.alts{margin-top:8px}
.alts summary{cursor:pointer;font-size:13px;color:var(--route);list-style:none;display:inline-flex;align-items:center;gap:6px}
.alts summary::-webkit-details-marker{display:none}
.alts summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.alts[open] summary::before{transform:rotate(45deg)}
.alts .item{margin-top:8px;font-size:14px}
.alts .cost{display:block;color:var(--ink-3);font-size:12.5px;font-style:italic;margin-top:1px}
.buffer{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);font-style:italic;font-family:var(--serif);line-height:1.5}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.daynav button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);background:var(--panel)}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .back{color:var(--route);border:0;padding:6px 0}
.ov h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.ov .sub{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.ov .top5{margin:0 0 18px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.5}
.ov .top5 b{font-weight:600;display:block;margin-bottom:4px}
.ovday{display:grid;grid-template-columns:28px 1fr;gap:0 12px;padding:10px 8px 10px 4px;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:8px}
.ovday:hover{background:var(--bg)}
.ovday:first-of-type{border-top:0}
.ovday .pin{justify-self:center;margin-top:3px}
.ovday .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ovday .l1 b{font-weight:600}
.ovday .l1 small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.ovday .l2{color:var(--ink-2);font-size:13px;margin-top:1px}
.ovday .l3{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.ovday .l3 span{display:inline-flex;align-items:center;gap:5px}
.ov .keys{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:6px}
.ov .keys span{display:inline-flex;align-items:center;gap:8px}
.soc{display:inline-flex;gap:4px;margin-left:8px;vertical-align:-3px}
.tagsel{font:inherit;font-size:11px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:6px;height:22px;padding:0 4px;max-width:150px}
.soc a{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:var(--ink-3);border:1px solid var(--line);background:var(--panel)}
.soc a svg{width:14px;height:14px;fill:currentColor}
.soc a:hover{color:var(--route);border-color:var(--route)}
.pp-links .soc{margin-left:0}
.inc{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11.5px;color:var(--ink-3);vertical-align:1px;cursor:pointer;white-space:nowrap}
.inc input{margin:0;accent-color:var(--route);width:13px;height:13px}
.gm{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gm .lbl{flex:1 1 100%;font-size:13px;color:var(--ink-2)}
.gm a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink);text-decoration:none}
.gm a.primary{background:var(--route);border-color:var(--route);color:var(--tab-ink)}
.gm small{flex:1 1 100%;font-size:11.5px;color:var(--ink-3)}
.pp-links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.pp-links a,.pp-links button{font-size:12.5px;color:var(--route);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.settings{padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;background:var(--bg)}
.settings summary{cursor:pointer;color:var(--ink-2)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 12px;padding:10px 0 4px}
.sgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3)}
.sgrid input{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.sgrid .wide{grid-column:1/-1}
.btn{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink);background:var(--panel)}
.btn.primary{background:var(--route);border-color:var(--route);color:var(--tab-ink)}
.stayx{margin:-4px 0 16px;border:1px solid var(--line);border-radius:12px;padding:0;font-size:13.5px;overflow:hidden}
.stayx summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;font-weight:600;color:var(--ink);list-style:none}
.stayx summary::-webkit-details-marker{display:none}
.stayx summary small{font-weight:400;color:var(--ink-3);font-size:12px;white-space:nowrap}
.stayx[open] summary{border-bottom:1px solid var(--line)}
.stayx-body{padding:10px 14px 12px}
.stayx .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stayx .row.sub{margin-top:8px;font-size:12px;color:var(--ink-3);justify-content:space-between}
.stayx select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:48%}
.stayx .budget{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:0 8px;height:32px;font-size:13px;color:var(--ink-2)}
.stayx .budget input{width:52px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:right}
.stayx .budget span{color:var(--ink-3);font-size:12px}
.btn.icon{width:32px;padding:0;text-align:center;font-size:15px}
.chk{display:inline-flex;align-items:center;gap:5px}
.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0}
.hsum{font-size:12.5px;color:var(--ink-2);margin:10px 0 4px}
.hlist{max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.hcard{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:9px 10px 9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.hcard.ex{opacity:.6}
.hnum{width:26px;height:26px;border-radius:7px;background:var(--worth);color:#fff;font:600 12px/26px var(--sans);text-align:center;margin-top:1px}
.hcard.ex .hnum{background:var(--line);color:var(--ink-3)}
.hname{font-weight:600;line-height:1.3}
.hstats{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.hstats b{color:var(--ink);font-size:15px}
.hstats .star{color:#E3A72F;margin-left:-8px;font-size:12px}
.hstats .htype{color:var(--ink-3)}
.hstats .why,.hchk .why{color:var(--must)}
.hact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.hdot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ink-3);flex:none}
.hdot.clear{background:#3BA55D} .hdot.possible{background:#E3A72F} .hdot.unverified{background:var(--ink-3)} .hdot.skipped{background:var(--line)}
.act{font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);cursor:pointer;line-height:1.3}
.act.book{background:#0071C2;border-color:#0071C2;color:#fff;font-weight:600}
.act.bookweb{color:#0071C2;border-color:#0071C2}
.act.warn{color:#B8761E;border-color:#B8761E}
.act.x{margin-left:auto;padding:3px 8px;color:var(--ink-3)}
.hchk{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:6px}
.hchk .hdot{margin-right:-4px}
.gs{font-size:12px;color:var(--ink-3)}
.hexpl{font-size:12px;color:var(--ink-3);margin:0 0 8px;line-height:1.45}
.hexpl b{color:var(--ink-2)}
.hkey{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.hkey span{display:inline-flex;align-items:center;gap:5px}
.pchip{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;background:var(--bg);color:var(--ink-2);vertical-align:1px}
.pchip.high{color:var(--must);background:var(--deadline-bg)}
.hotelpin{width:20px;height:20px;border-radius:5px;background:var(--worth);color:#fff;font:600 11px/20px var(--sans);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.nav button{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13.5px;color:var(--ink)}
.nav button:disabled{opacity:.4;cursor:default}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Turkey by car<small>8 – 18 October 2026 · build 39</small></h1>
    <div class="legend"><span><i class="ind m"></i>must-see</span><span><i class="ind w"></i>worth it</span><span><i class="ind o"></i>optional</span><span><i class="ind m alt"></i><i class="ind w alt"></i><i class="ind o alt"></i>hollow = alternative</span><span><i class="ind night">3</i>night stop</span></div>
  </header>

  <div class="mapwrap">
    <div id="map" role="region" aria-label="Route map"></div>
    <div class="mapnote">Tap a night pin for its day, any dot for details.</div>
  </div>

  <div class="panel">
    <div id="settingsHost"></div>
    <nav class="tabs" id="tabs" aria-label="Days"></nav>
    <section class="day" id="day"></section>
  </div>
</div>

<script>
/* ---------- accommodation search config ----------
   Paste your keys here (both restricted to https://alecsandrudaj.github.io/* in Google Cloud):
   GOOGLE_API_KEY: Places API (New) + Custom Search API enabled
   CSE_ID: Programmable Search Engine id (search the whole web; add booking.com, tripadvisor.com, google.com as priority sites) */
const GOOGLE_API_KEY='PASTE_GOOGLE_API_KEY';
const CSE_ID='b029a9e28305a4069';

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true}).setView([37.6,34.5],6);
const esriAttr='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors, and the GIS User Community';
const streets=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr});
const topo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'});
const otm=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const hosted=location.protocol==='http:'||location.protocol==='https:';
const layers=hosted?{'OpenStreetMap':osm,'Streets (Esri)':streets,'Terrain':topo,'Satellite':sat,'OpenTopoMap':otm}
                   :{'Streets':streets,'Terrain':topo,'Satellite':sat,'OpenTopoMap':otm};
(hosted?osm:streets).addTo(map);
L.control.layers(layers,null,{position:'topright',collapsed:true}).addTo(map);
// if the first tiles fail, fall back to OpenTopoMap automatically
let tileErrors=0;
streets.on('tileerror',()=>{ if(++tileErrors===6&&map.hasLayer(streets)){ map.removeLayer(streets); otm.addTo(map); } });
const LL=k=>{const c=C[k];return [c[1],c[0]];};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const tierName={m:'must-see',w:'worth it',o:'optional',n:''};
const gmPoint=k=>{const c=C[k];return c[1].toFixed(5)+','+c[0].toFixed(5);};
const gmSearch=k=>'https://www.google.com/maps/search/?api=1&query='+gmPoint(k);

// Android Chrome: intent straight into the app's search, web fallback. iPhone: a plain tap on the hashtag page
// (a registered app link) is the only thing Safari hands to the app; script redirects stay in the browser.
function openTikTok(q,ev){
  const ua=navigator.userAgent||'';
  if(/Android/i.test(ua)&&/Chrome/i.test(ua)&&!/SamsungBrowser|Firefox|EdgA/i.test(ua)){
    ev.preventDefault();
    // open TikTok's own web address inside the TikTok app (the app handles tiktok.com links); web if not installed
    location.href='intent://www.tiktok.com/tag/'+igTag(q)+'#Intent;scheme=https;package=com.zhiliaoapp.musically;S.browser_fallback_url='+encodeURIComponent(tiktokURL(q))+';end';
  }
}

document.addEventListener('change',e=>{

  soc.querySelectorAll('a[data-tt]').forEach(a=>{a.href=tiktokURL(tag);a.dataset.tt=tag;a.title='TikTok #'+tag;});
  soc.querySelectorAll('a[href*="instagram.com"]').forEach(a=>{a.href='https://www.instagram.com/explore/tags/'+tag+'/';a.title='Instagram #'+tag;});
});

function copyText(t,btn){ try{ navigator.clipboard.writeText(t).then(()=>{ if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200);} }); }catch(e){ prompt('Coordinates',t); } }
// which items are included in a day's exported route: ids like 'fri9-2-p' (slot 2 primary) or 'fri9-2-a1' (slot 2, alternative 1)
const chosen={};
function defaultChosen(d){
  if(chosen[d.id]) return chosen[d.id];
  const set=new Set(); d.slots.forEach((sl,i)=>{ if(sl.p&&sl.p.at) set.add(d.id+'-'+i+'-p'); });
  chosen[d.id]=set; return set;
}
function dayEndpoints(d){
  const i=days.indexOf(d);
  const origin=d.id==='thu8'?'ayt':(i>0?days[i-1].night:null);
  const dest=d.night||(d.id==='sun18'?'istanbul':null);
  return {origin,dest};
}
function dayRouteKeys(d,withStops){
  const {origin,dest}=dayEndpoints(d); if(!origin||!dest) return null;
  let keys=[];
  if(withStops){
    const set=defaultChosen(d);
    d.slots.forEach((sl,i)=>{
      if(sl.p&&sl.p.at&&set.has(d.id+'-'+i+'-p')) keys.push({k:sl.p.at,t:sl.p.tier||'n'});
      (sl.alts||[]).forEach((a,j)=>{ if(a.at&&set.has(d.id+'-'+i+'-a'+j)) keys.push({k:a.at,t:a.tier||'n'}); });
    });
  }
  // drop points that are the origin/destination themselves, and consecutive duplicates
  keys=keys.filter(x=>x.k!==origin&&x.k!==dest).filter((x,idx,arr)=>idx===0||arr[idx-1].k!==x.k);
  // Google accepts at most 9 waypoints: drop optional, then worth-it, from the end
  for(const t of ['n','o','w']) while(keys.length>9&&keys.some(x=>x.t===t)){ const idx=keys.map(x=>x.t).lastIndexOf(t); keys.splice(idx,1); }
  while(keys.length>9) keys.pop();
  return {origin,dest,waypoints:keys.map(x=>x.k)};
}
function gmDirections(d,withStops){
  const r=dayRouteKeys(d,withStops); if(!r) return null;
  let u='https://www.google.com/maps/dir/?api=1&origin='+gmPoint(r.origin)+'&destination='+gmPoint(r.dest)+'&travelmode='+(d.id==='sun18'?'walking':'driving');
  if(r.waypoints.length) u+='&waypoints='+r.waypoints.map(gmPoint).join('|');
  return {url:u,n:r.waypoints.length};
}

const legs={}, legLayer=L.layerGroup().addTo(map);
const routed={}; // dayId -> {km, min, note}
const fmtH=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?h+' h '+(m<10?'0':'')+m:m+' min';};
function rtText(id){
  const r=routed[id]; if(!r) return '';
  return Math.round(r.km)+' km · '+fmtH(r.min)+' driving (router)'+(r.note?' '+r.note:'')+' · plan for '+fmtH(r.min*1.2)+' with stops for fuel and traffic';
}
function showRouted(id){
  document.querySelectorAll('[data-rt="'+id+'"]').forEach(el=>{el.textContent=rtText(id);});
}
const nightKeys=new Set(['ayt','fethiye','antalya','kizkalesi','urfa','karadut','gaziantep','goreme','konya','istanbul']);
days.forEach(d=>{
  const pts=d.route.map(LL); if(pts.length<2) return;
  legs[d.id]=L.polyline(pts,{color:'#1E3F8A',weight:3,opacity:.25,dashArray:d.train?'6 8':null,lineJoin:'round'}).addTo(legLayer);
  if(d.train) return;
  // real road geometry from OSRM when online; waypoint line stays as fallback
  const osrm=(keys)=>fetch('https://router.project-osrm.org/route/v1/driving/'+keys.map(k=>C[k][0]+','+C[k][1]).join(';')+'?overview=full&geometries=geojson').then(r=>r.json());
  osrm(d.route).then(j=>{
      const rt=j.routes&&j.routes[0]; if(!rt) return;
      if(d.climbMax&&rt.distance>d.climbMax){
        // the router went round the mountain: route only to the village, draw the climb ourselves
        return osrm(d.route.slice(0,-1)).then(j2=>{
          const r2=j2.routes&&j2.routes[0]; if(!r2) return;
          legs[d.id].setLatLngs(r2.geometry.coordinates.map(c=>[c[1],c[0]])); legs[d.id].setStyle({dashArray:null});
          if(legs[d.id+'-climb']) legs[d.id+'-climb'].addTo(legLayer);
          routed[d.id]={km:r2.distance/1000+12,min:r2.duration/60+30,note:'(incl. 12 km / 30 min summit road)'}; showRouted(d.id);
        });
      }
      legs[d.id].setLatLngs(rt.geometry.coordinates.map(c=>[c[1],c[0]]));
      legs[d.id].setStyle({dashArray:null});
      if(legs[d.id+'-climb']) legLayer.removeLayer(legs[d.id+'-climb']);
      routed[d.id]={km:rt.distance/1000,min:rt.duration/60}; showRouted(d.id);
    }).catch(()=>{ legs[d.id].setStyle({dashArray:'2 6'}); });
});

// every objective, primary and alternative
const poiMarkers=[]; // {day, el, marker}
days.forEach(d=>{
  d.slots.forEach(s=>{
    const items=[[s.p,false]].concat((s.alts||[]).map(a=>[a,true]));
    items.forEach(([it,isAlt])=>{
      if(!it.at||!C[it.at]) return;
      const tier=it.tier&&it.tier!=='n'?it.tier:'o';
      const html='<div class="poipin '+tier+(isAlt?' alt':'')+'" data-day="'+d.id+'"></div>';
      const sz=tier==='m'?15:tier==='w'?12:11;
      const mk=L.marker(LL(it.at),{icon:L.divIcon({className:'',html,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),zIndexOffset:tier==='m'?500:tier==='w'?300:100,title:it.name}).addTo(map);
      let pp='<div class="pp-day">'+esc(d.tab[0])+' · '+esc(s.t)+'</div><div class="pp-name">'+esc(it.name)+(it.tier&&it.tier!=='n'?'<span class="pp-tag '+it.tier+'">'+tierName[it.tier]+(isAlt?', alternative':'')+'</span>':'')+'</div>';
      if(isAlt) pp+='<div class="pp-alt">not in the plan by default; swaps with the primary choice in this slot</div>';
      if(it.d) pp+='<div class="pp-d">'+esc(it.d)+(it.dur?' <span style="color:var(--ink-3)">('+esc(it.dur)+')</span>':'')+'</div>';
      if(it.cost) pp+='<div class="pp-cost">'+esc(it.cost)+'</div>';
      pp+='<div class="pp-links"><a target="_blank" rel="noopener" href="'+gmSearch(it.at)+'">Open in Google Maps</a><button data-copy="'+gmPoint(it.at)+'">Copy coordinates</button><a href="#" data-go="'+d.id+'">Open '+esc(d.tab[0])+' →</a></div>';
      pp+='<div class="pp-links">'+socialHTML(it)+'</div>';
      mk.bindPopup(pp);
      mk.on('popupopen',e=>{const el=e.popup.getElement();
        const a=el.querySelector('[data-go]');a&&a.addEventListener('click',ev=>{ev.preventDefault();select(d.id);map.closePopup();});
        const c=el.querySelector('[data-copy]');c&&c.addEventListener('click',()=>copyText(c.dataset.copy,c));});
      poiMarkers.push({day:d.id,marker:mk});
    });
  });
});

function mapSelect(id){
  if(id==='overview'){
    for(const k in legs){ const dd=days.find(x=>x.id===k.replace('-climb','')); legs[k].setStyle({opacity:.85,weight:3.5,color:dd&&dd.train?'#5B6E9E':'#1E3F8A'}); }
    document.querySelectorAll('.poipin').forEach(el=>{el.classList.remove('on');el.classList.toggle('all',el.classList.contains('m')&&!el.classList.contains('alt'));});
    document.querySelectorAll('.nightpin').forEach(el=>el.classList.add('active'));
    const all=[]; for(const k in C) if(nightKeys.has(k)) all.push(LL(k));
    map.fitBounds(L.latLngBounds(all).pad(0.08),{animate:booted});
    return;
  }
  document.querySelectorAll('.poipin').forEach(el=>el.classList.remove('all'));
  const d=days.find(x=>x.id===id);
  for(const k in legs){ const on=(k===id||k===id+'-climb'); legs[k].setStyle({opacity:on?1:.25,weight:on?(k.endsWith('-climb')?4:5):3,color:on?(d.train?'#5B6E9E':'#1E3F8A'):'#1E3F8A'}); }
  document.querySelectorAll('.poipin').forEach(el=>el.classList.toggle('on',el.dataset.day===id));
  document.querySelectorAll('.nightpin').forEach(el=>el.classList.remove('active'));
  const i=days.indexOf(d);
  const on=[]; if(d.night) on.push(d.night); if(i>0&&days[i-1].night) on.push(days[i-1].night);
  if(id==='thu8') on.push('ayt'); if(id==='sun18') on.push('istanbul');
  on.forEach(k=>{const el=document.getElementById('np-'+k);el&&el.classList.add('active');});
  // fit to this day's route + its objectives
  const pts=d.route.concat(d.climb||[]).map(LL).concat(poiMarkers.filter(p=>p.day===id).map(p=>p.marker.getLatLng()));
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(id==='thu15'||id==='sun18'?0.25:0.12),{animate:booted,maxZoom:id==='sun18'?15:13});
}

function staySettings(){
  let o={}; try{ o=JSON.parse(localStorage.getItem('staySettings')||'{}'); }catch(e){}
  const key=(o.key&&o.key.trim())||(GOOGLE_API_KEY.startsWith('PASTE')?'':GOOGLE_API_KEY);
  const cse=(o.cse&&o.cse.trim())||(CSE_ID.startsWith('PASTE')?'':CSE_ID);
  const script=(o.script&&o.script.trim())||BACKEND_URL; const pin=(o.pin&&o.pin.trim())||BACKEND_PIN;
  return Object.assign({},STAY_DEFAULTS,o,{key,cse,script,pin});
}
function saveStaySettings(o){ try{ localStorage.setItem('staySettings',JSON.stringify(o)); }catch(e){} }
const hidden=()=>{ try{ return new Set(JSON.parse(localStorage.getItem('hiddenHotels')||'[]')); }catch(e){ return new Set(); } };
const setHidden=set=>{ try{ localStorage.setItem('hiddenHotels',JSON.stringify([...set])); }catch(e){} };
const cacheGet=(k,maxAge)=>{ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); if(v&&Date.now()-v.t<maxAge) return v.d; }catch(e){} return null; };
const cacheSet=(k,d)=>{ try{ localStorage.setItem(k,JSON.stringify({t:Date.now(),d})); }catch(e){} };
const termList=st=>st.terms.split(',').map(t=>t.trim()).filter(Boolean);
const priceBand={PRICE_LEVEL_INEXPENSIVE:'€',PRICE_LEVEL_MODERATE:'€€',PRICE_LEVEL_EXPENSIVE:'€€€',PRICE_LEVEL_VERY_EXPENSIVE:'€€€€'};
const distKm=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

async function placesSearch(area,st){
  const qs=[area.q, area.q.replace(/^(cave hotel|hotels|pension hotel)/i,'pension guesthouse apart hotel')];
  const all=[]; const seen=new Set();
  for(const q of qs){ for(const p of await placesSearchOne(Object.assign({},area,{q}),st)){ if(!seen.has(p.id)){seen.add(p.id);all.push(p);} } }
  return all;
}
async function placesSearchOne(area,st){
  const body={textQuery:area.q,includedType:'lodging',minRating:st.minRating,pageSize:20,languageCode:'en',
    locationBias:{circle:{center:{latitude:area.lat,longitude:area.lng},radius:area.r}}};
  const r=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':st.key,
    'X-Goog-FieldMask':'places.id,places.displayName,places.rating,places.userRatingCount,places.priceLevel,places.googleMapsUri,places.location,places.primaryTypeDisplayName,places.websiteUri,places.shortFormattedAddress'},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error('Places '+r.status+': '+t.slice(0,160)); }
  return (await r.json()).places||[];
}
async function webCheck(name,city,st){
  if(!st.cse) return {state:'unverified',reason:'no search engine configured'};
  const k='web2:'+name; const c=cacheGet(k,7*24*3600e3); if(c) return c;
  const get=async q=>{ const r=await fetch('https://www.googleapis.com/customsearch/v1?key='+encodeURIComponent(st.key)+'&cx='+encodeURIComponent(st.cse)+'&num=5&q='+encodeURIComponent(q)); if(!r.ok) return {error:r.status}; const j=await r.json(); return {total:+(j.searchInformation?.totalResults||0),items:(j.items||[]).map(i=>({title:i.title,link:i.link,snippet:i.snippet}))}; };
  const base=await get('"'+name+'" '+city); let out;
  if(base.error) out={state:'unverified',reason:'search error '+base.error};
  else if(base.total===0) out={state:'unverified',reason:'no web coverage of this hotel',baseline:0};
  else{
    const pest=await get('"'+name+'" '+city+' ('+termList(st).map(t=>t.includes(' ')?'"'+t+'"':t).join(' OR ')+')');
    if(pest.error) out={state:'unverified',reason:'search error '+pest.error,baseline:base.total};
    else{ const low=termList(st).map(t=>t.toLowerCase()); const inSn=pest.items.filter(it=>{const x=((it.title||'')+' '+(it.snippet||'')).toLowerCase();return low.some(t=>x.includes(t));});
      out=inSn.length?{state:'flagged',hits:pest.items.length,items:inSn,baseline:base.total}:pest.items.length?{state:'possible',hits:pest.items.length,items:pest.items,baseline:base.total}:{state:'clear',hits:0,items:[],baseline:base.total}; }
  }
  cacheSet(k,out); return out;
}
// Booking filter codes: price=EUR-min-<max>-1 (per night, whole party), review_score=80 (8+), tdb=2 (twin beds)
const bookingParams=(cfg,st)=>'&checkin='+cfg.checkin+'&checkout='+cfg.checkout+'&group_adults='+st.adults+'&no_rooms='+st.rooms+'&group_children=0&selected_currency=EUR&lang=en-gb&nflt='+encodeURIComponent('price=EUR-min-'+(st.maxPrice*st.rooms)+'-1;review_score=80;tdb=2');
// experimental: Booking's private app scheme, same parameters as the web search plus the filters
const bookingAppURL=(ss,cfg,st)=>'booking://searchresults?ss='+encodeURIComponent(ss)+'&checkin='+cfg.checkin+'&checkout='+cfg.checkout+'&group_adults='+st.adults+'&no_rooms='+st.rooms+'&group_children=0&nflt='+encodeURIComponent('price=EUR-min-'+(st.maxPrice*st.rooms)+'-1;review_score=80;tdb=2')+'&selected_currency=EUR';
// one hotel: Booking resolves an exact property name as the destination and lists it first
const bookingURL=(name,cfg,st)=>'https://www.booking.com/searchresults.html?ss='+encodeURIComponent(name)+'&dest_type=hotel'+bookingParams(cfg,st);
// the whole area: Booking's own search with filters applied
// Booking's "distance from centre" filter takes metres inside nflt; it uses the same ≤ km value as the page
const bookingAreaURL=(area,cfg,st)=>'https://www.booking.com/searchresults.html?ss='+encodeURIComponent(area.label.split(',')[0]+', '+cfg.city)+'&latitude='+area.lat+'&longitude='+area.lng+'&radius='+Math.round(area.r/1000)+'&order=popularity'+bookingParams(cfg,st)+encodeURIComponent(';distance='+Math.round((st.maxDist||3)*1000));
// Phones hand booking.com links to the Booking app, which drops the filters.
// Android: an intent that targets Chrome itself opens the URL as a plain page. iOS: opening from script keeps it in Safari.
function openWeb(url,ev){
  ev.preventDefault();
  const ua=navigator.userAgent||'';
  if(/Android/i.test(ua)){
    const bare=url.replace(/^https?:\/\//,'');
    location.href='intent://'+bare+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    return;
  }
  window.open(url,'_blank','noopener');
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-web]'); if(a) openWeb(a.href,e);});
const reportsURL=(name,city,st)=>'https://www.google.com/search?q='+encodeURIComponent('"'+name+'" '+city+' ('+termList(st).slice(0,8).map(t=>t.includes(' ')?'"'+t+'"':t).join(' OR ')+')');

async function backend(params,st){
  const u=st.script+'?'+new URLSearchParams(Object.assign({pin:st.pin},params)).toString();
  const r=await fetch(u,{redirect:'follow'}); if(!r.ok) throw new Error('Backend '+r.status);
  const j=await r.json(); if(j.error) throw new Error('Backend: '+j.error); return j;
}
function stayCfg(d){ let c=stayAreas[d.id]; if(c&&c.same) c=stayAreas[c.same]; return c; }

  const st=staySettings();
  let h='<details class="stayx" id="stayx"><summary><span>Where to sleep</span><small>'+esc(cfg.checkin.slice(5).replace('-','/'))+' → '+esc(cfg.checkout.slice(5).replace('-','/'))+' · '+st.adults+' adults · '+st.rooms+' rooms</small></summary><div class="stayx-body">';
  h+='<div class="row"><select id="stayArea" aria-label="Area">'+cfg.areas.map((a,i)=>'<option value="'+i+'">'+esc(a.label)+'</option>').join('')+'</select>'
    +'<select id="staySort" aria-label="Sort"><option value="reviews"'+(st.sort==='reviews'?' selected':'')+'>most reviewed</option><option value="rating"'+(st.sort==='rating'?' selected':'')+'>best rated</option></select>'
    +'<label class="budget">≤ €<input id="stayBudget" type="number" min="10" step="10" value="'+st.maxPrice+'"><span>/room</span></label>'

  h+='<div id="stayOut"></div></div></details>';
  return h;

async function runStay(d,force){
  const cfg=stayCfg(d), st=staySettings(), out=document.getElementById('stayOut'); if(!cfg||!out) return;
  const area=cfg.areas[+document.getElementById('stayArea').value];
  const minReviews=cfg.minReviews||st.minReviews;
  st.sort=document.getElementById('staySort')?.value||st.sort;
  st.maxPrice=+document.getElementById('stayBudget')?.value||st.maxPrice;
  st.showExcluded=!!document.getElementById('stayShowEx')?.checked;
  st.maxDist=+document.getElementById('stayDist')?.value||st.maxDist||3;
  { let o={}; try{o=JSON.parse(localStorage.getItem('staySettings')||'{}');}catch(e){} Object.assign(o,{sort:st.sort,maxPrice:st.maxPrice,showExcluded:st.showExcluded,maxDist:st.maxDist}); saveStaySettings(o); }
  let places, hid=hidden(), cachedAt=null, webMap=null;
  if(st.script){
    if(!st.pin){ out.innerHTML='<div class="hint">Enter the backend PIN in Settings.</div>'; return; }
    out.innerHTML='<div class="hint">Asking the backend (cached results come back instantly)…</div>';
    try{
      const j=await backend({action:'search',day:d.id,areaLabel:area.label,q:area.q,lat:area.lat,lng:area.lng,r:area.r,city:cfg.city,minRating:st.minRating,minReviews:minReviews,maxDist:st.maxDist,terms:st.terms,refresh:force?'1':'0'},st);
      places=j.rows; cachedAt=j.cachedAt; hid=new Set(j.hidden||[]); webMap=true;
    }catch(e){ out.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; return; }
  }else{
    if(!st.key){ out.innerHTML='<div class="hint">Set the backend URL and PIN (or an API key) in Settings first.</div>'; return; }
    if(location.protocol==='file:'){ out.innerHTML='<div class="hint">The key is restricted to the hosted page; open the GitHub Pages address to search.</div>'; return; }
    out.innerHTML='<div class="hint">Searching Google Places…</div>';
    const ck='places:'+area.q+':'+st.minRating; let raw=force?null:cacheGet(ck,24*3600e3);
    try{ if(!raw){ raw=await placesSearch(area,st); cacheSet(ck,raw); } }catch(e){ out.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; return; }
    places=raw.map(p=>({id:p.id,name:p.displayName?.text||'',rating:p.rating||0,count:p.userRatingCount||0,price:p.priceLevel||'',
      maps:p.googleMapsUri,lat:p.location?.latitude,lng:p.location?.longitude,type:p.primaryTypeDisplayName?.text||'',site:p.websiteUri,addr:p.shortFormattedAddress||''}));
  }
  let rows=places.map(r=>Object.assign({},r,{price:priceBand[r.price]||r.price||''}));
  rows.forEach(r=>{ r.dist=(r.lat&&r.lng)?distKm(area.lat,area.lng,r.lat,r.lng):null; });
  const excluded=[];
  rows=rows.filter(r=>{ if(hid.has(r.id)){excluded.push({r,why:'hidden by you'});return false;} if(r.count<minReviews){excluded.push({r,why:r.count+' reviews, below '+minReviews});return false;} if(r.rating<st.minRating){excluded.push({r,why:'score '+r.rating});return false;} if(r.dist!=null&&r.dist>st.maxDist){excluded.push({r,why:r.dist.toFixed(1)+' km from the area'});return false;} return true; });
  rows.sort((a,b)=>st.sort==='rating'?(b.rating-a.rating||b.count-a.count):(b.count-a.count));
  if(st.results>0) rows=rows.slice(0,st.results+6);
  if(!webMap){
    out.innerHTML='<div class="hint">Checking the web for pest reports…</div>';
    const checks=await Promise.all(rows.map(r=>webCheck(r.name,cfg.city,st).catch(()=>null)));
    rows.forEach((r,i)=>r.web=checks[i]);
  }
  const passed=[];
  rows.forEach(r=>{ const w=r.web||{state:'unverified',reason:'not checked'}; const g=r.greviews||{scanned:0,hits:[]};
    if(g.hits&&g.hits.length){ excluded.push({r,why:'Google review ('+g.hits[0].rating+'★, '+esc(g.hits[0].when)+'): “'+g.hits[0].quote+'”',gquote:true}); }
    else if(w.state==='flagged'){ excluded.push({r,why:'pest terms in '+w.items.length+' web result'+(w.items.length>1?'s':''),items:w.items}); }
    else passed.push(r); });
  st.cachedAt=cachedAt;
  render_stay(st.results>0?passed.slice(0,st.results):passed,excluded,cfg,area,st);
}

function render_stay(rows,excluded,cfg,area,st){
  const out=document.getElementById('stayOut');
  hotelLayer.clearLayers();
  const stateOf=r=>(r.web&&r.web.state)||'unverified';
  const dot=st_=>'<i class="hdot '+st_+'" title="'+({clear:'Clear: web pages found, no pest mentions',possible:'Possible: pages mention the hotel near the terms, check',unverified:'Unverified: little web coverage, check manually',skipped:'Not checked'}[st_]||'')+'"></i>';
  const cnt={clear:0,possible:0,unverified:0}; rows.forEach(r=>{const k=stateOf(r); if(cnt[k]!=null) cnt[k]++;});
  const flagged=excluded.filter(e=>e.items||e.gquote).length;
  let h='<div class="hsum">'+rows.length+' hotels'+(excluded.length?' · <span class="dim">'+excluded.length+' excluded'+(flagged?' ('+flagged+' for pest mentions)':'')+'</span>':'')+(st.cachedAt?' · <span class="dim">'+esc(new Date(st.cachedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}))+' '+esc(new Date(st.cachedAt).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}))+'</span>':'')+'</div>';
  h+='<div class="hexpl">Each hotel was checked two ways: a web search (Booking, TripAdvisor, blogs) for the pest terms, and the Google reviews the API returns (up to 5). Web check: <b>'+cnt.clear+'</b> clear, <b>'+cnt.possible+'</b> possible, <b>'+cnt.unverified+'</b> unverified.</div>';
  h+='<div class="hlist">';
  if(!rows.length) h+='<div class="hint">Nothing passed here. Try another area or lower the review floor in Settings.</div>';
  rows.forEach((r,i)=>{
    const w=r.web||{}; const stt=stateOf(r);
    h+='<div class="hcard"><div class="hnum">'+(i+1)+'</div><div class="hbody">'
      +'<div class="hname">'+esc(r.name)+(r.price?' <span class="pchip'+(r.price.length>=3?' high':'')+'">'+r.price+'</span>':'')+'</div>'
      +'<div class="hstats"><b>'+r.rating.toFixed(1)+'</b><span class="star">★</span><span>'+r.count.toLocaleString()+'</span>'+(r.dist!=null?'<span>'+r.dist.toFixed(1)+' km</span>':'')+'<span class="htype">'+esc(r.type)+'</span></div>'
      +'<div class="hchk">'+dot(stt)+'<span>'+({clear:'Web: '+(w.baseline||0)+' pages mention this hotel, none with the terms',possible:'Web: '+(w.items?w.items.length:0)+' page'+(w.items&&w.items.length>1?'s':'')+' mention it near the terms, look before booking',unverified:'Web: '+(w.reason==='no web coverage of this hotel'?'almost nothing written about it online':'check failed ('+esc(w.reason||'')+')')+', check Maps reviews yourself',skipped:'Web: not checked'}[stt]||'')+'</span>'
      +(r.greviews?'<span class="gs">Google: '+r.greviews.scanned+' review'+(r.greviews.scanned===1?'':'s')+' scanned, clean</span>':'')+'</div>'
      +'<div class="hact">'
      +'<a href="'+bookingURL(r.name,cfg,st)+'" class="act book" title="Tap: Booking app with dates and party. Long-press → open in incognito tab: browser with twin beds, 8+ and the price cap applied">Booking</a>'
      +'<a target="_blank" rel="noopener" href="'+r.maps+'" class="act">Maps</a>'
      +'<a target="_blank" rel="noopener" href="'+reportsURL(r.name,cfg.city,st)+'" class="act">Web</a>'
      +(w.items&&w.items.length&&stt==='possible'?'<a target="_blank" rel="noopener" href="'+esc(w.items[0].link)+'" class="act warn" title="'+esc(w.items[0].title)+'">mention</a>':'')
      +'<button class="act x" data-hide="'+r.id+'" title="Hide">×</button></div>'
      +'</div></div>';
    if(r.lat&&r.lng){
      const m=L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:'<div class="hotelpin">'+(i+1)+'</div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:700}).addTo(hotelLayer);
      m.bindPopup('<div class="pp-name">'+esc(r.name)+'</div><div class="pp-d">'+r.rating.toFixed(1)+' ★ · '+r.count+' reviews</div><div class="pp-links"><a target="_blank" rel="noopener" href="'+r.maps+'">Maps</a><a target="_blank" rel="noopener" href="'+bookingURL(r.name,cfg,st)+'">Booking</a></div>');
    }
  });
  if(st.showExcluded) excluded.forEach(e=>{ const r=e.r; h+='<div class="hcard ex"><div class="hnum">–</div><div class="hbody"><div class="hname">'+esc(r.name)+'</div><div class="hstats"><b>'+r.rating.toFixed(1)+'</b><span class="star">★</span><span>'+r.count+'</span></div><div class="hchk"><span class="why">Excluded: '+esc(e.why)+'</span></div><div class="hact">'+(e.items?'<a target="_blank" rel="noopener" href="'+esc(e.items[0].link)+'" class="act warn">'+esc(e.items[0].title.slice(0,40))+'…</a>':'')+(e.gquote?'<span class="act warn">Google review</span>':'')+'<a target="_blank" rel="noopener" href="'+r.maps+'" class="act">Maps</a>'+(e.why==='hidden by you'?'<button class="act" data-unhide="'+r.id+'">unhide</button>':'')+'</div></div></div>'; });
  h+='</div>';
  h+='<div class="hkey"><span>'+dot('clear')+'clear</span><span>'+dot('possible')+'possible</span><span>'+dot('unverified')+'unverified</span><span class="dim">· flagged ones are excluded · long-press Booking → incognito tab for the filtered browser view</span></div>';
  out.innerHTML=h;
  if(rows.some(r=>r.lat)){ map.fitBounds(L.latLngBounds(rows.filter(r=>r.lat).map(r=>[r.lat,r.lng])).pad(0.3),{maxZoom:15}); }
  out.querySelectorAll('[data-hide]').forEach(b=>b.addEventListener('click',async()=>{ if(st.script){ try{ await backend({action:'hide',id:b.dataset.hide,name:(rows.find(r=>r.id===b.dataset.hide)||{}).name||''},st);}catch(e){} } else { const h=hidden();h.add(b.dataset.hide);setHidden(h); } runStay(current_day(),false); }));
  out.querySelectorAll('[data-unhide]').forEach(b=>b.addEventListener('click',async()=>{ if(st.script){ try{ await backend({action:'unhide',id:b.dataset.unhide},st);}catch(e){} } else { const h=hidden();h.delete(b.dataset.unhide);setHidden(h); } runStay(current_day(),false); }));
}

function itemHTML(it,alt,incId,checked){
  const tier=it.n?'n':(it.tier||'n');
  let h='<div class="item '+tier+'">';
  if(tier!=='n') h+='<i class="ind '+tier+(alt?' alt':'')+'"></i>';
  h+='<span class="name">'+esc(it.name)+'</span>';
  if(tier!=='n'||it.at) h+=socialHTML(it,it.at);
  if(incId&&it.at) h+='<label class="inc" title="Include in the exported Google Maps route"><input type="checkbox" data-inc="'+incId+'" '+(checked?'checked':'')+'> route</label>';
  if(it.dur) h+='<span class="dur">'+esc(it.dur)+'</span>';
  if(it.d) h+='<div class="d">'+esc(it.d)+'</div>';
  if(alt&&it.cost) h+='<span class="cost">'+esc(it.cost)+'</span>';
  return h+'</div>';
}
function render(d){
  const i=days.indexOf(d);
  let h='<div class="daynav"><button class="back" data-ov>← Overview</button><span>Day '+(i+1)+' of '+days.length+'</span><span><button data-prev '+(i===0?'disabled':'')+' aria-label="Previous day">‹</button> <button data-next '+(i===days.length-1?'disabled':'')+' aria-label="Next day">›</button></span></div>';
  h+='<h2>'+esc(d.title)+'</h2><p class="sub">'+esc(d.sub)+'</p>';
  if(!d.train&&d.route.length>1) h+='<p class="rt" data-rt="'+d.id+'">'+esc(rtText(d.id)||'Measuring the route…')+'</p>';
  if(d.stay) h+='<p class="stay">'+esc(d.stay)+'</p>';
  h+=stayBlock(d);
  h+='<div class="deadline"><b>Hard deadline.</b> '+esc(d.deadline)+'</div>';
  d.slots.forEach(s=>{
    const set=defaultChosen(d), si=d.slots.indexOf(s);
    h+='<div class="slot"><div class="t">'+esc(s.t)+'</div><div>'+itemHTML(s.p,false,d.id+'-'+si+'-p',set.has(d.id+'-'+si+'-p'));
    if(s.alts&&s.alts.length){
      h+='<details class="alts"><summary>'+(s.alts.length===1?'1 alternative':s.alts.length+' alternatives')+'</summary>';
      s.alts.forEach((a,j)=>h+=itemHTML(a,true,d.id+'-'+si+'-a'+j,set.has(d.id+'-'+si+'-a'+j)));
      h+='</details>';
    }
    h+='</div></div>';
  });
  if(d.buffer) h+='<div class="buffer">'+esc(d.buffer)+'</div>';
  h+=gmBlock(d);
  h+='<div class="nav"><button id="prev" '+(i===0?'disabled':'')+'>← '+(i>0?esc(days[i-1].tab[0]):'')+'</button><button id="next" '+(i===days.length-1?'disabled':'')+'>'+(i<days.length-1?esc(days[i+1].tab[0]):'')+' →</button></div>';
  dayEl.innerHTML=h;
  dayEl.querySelector('#prev')?.addEventListener('click',()=>select(days[i-1].id));
  dayEl.querySelector('#next')?.addEventListener('click',()=>select(days[i+1].id));
  dayEl.querySelector('[data-prev]')?.addEventListener('click',()=>select(days[i-1].id));
  dayEl.querySelector('[data-next]')?.addEventListener('click',()=>select(days[i+1].id));
  dayEl.querySelector('[data-ov]')?.addEventListener('click',()=>select('overview'));
  document.getElementById('stayGo')?.addEventListener('click',()=>runStay(d,false));
  { const cfg=stayCfg(d); const sel=document.getElementById('stayArea'); const setA=()=>{ if(!cfg||!sel) return; const st=staySettings(); const u=bookingAreaURL(cfg.areas[+sel.value],cfg,st); const a1=document.getElementById('bkAreaApp'); if(a1) a1.href=u; }; setA(); sel?.addEventListener('change',setA); document.getElementById('stayDist')?.addEventListener('change',()=>{ const o=staySettings(); o.maxDist=+document.getElementById('stayDist').value||3; let p={}; try{p=JSON.parse(localStorage.getItem('staySettings')||'{}');}catch(e){} p.maxDist=o.maxDist; saveStaySettings(p); setA(); }); }
  document.getElementById('stayRefresh')?.addEventListener('click',()=>runStay(d,true));
  dayEl.querySelectorAll('[data-inc]').forEach(cb=>cb.addEventListener('change',()=>{
    const set=defaultChosen(d); cb.checked?set.add(cb.dataset.inc):set.delete(cb.dataset.inc); refreshGm(d);
  }));
}

function gmBlock(d){
  if(d.train) return '';
  const a=gmDirections(d,true), b=gmDirections(d,false); if(!a) return '';
  const {origin,dest}=dayEndpoints(d);
  return '<div class="gm" id="gm"><span class="lbl">Send today to Google Maps</span>'
    +'<a class="primary" target="_blank" rel="noopener" href="'+a.url+'">Route with the ticked stops ('+a.n+')</a>'
    +'<a target="_blank" rel="noopener" href="'+b.url+'">Direct, no stops</a>'
    +'<small>Opens the Google Maps app with the stops in order as coordinate pins; tick or untick "route" next to any item above to change what is sent. Google allows 9 stops, so optional ones are dropped first.</small></div>';
}
function refreshGm(d){ const el=document.getElementById('gm'); if(!el) return; el.outerHTML=gmBlock(d); }
function renderOverview(){
  let h='<div class="ov"><h2>Turkey by car, 10 nights</h2><p class="sub">Antalya to Istanbul the long way: the Lycian coast, Göbekli Tepe, Nemrut, Gaziantep, Cappadocia, Konya, then the train. About 2,100 km. Tap a day.</p>';
  h+='<div class="top5"><b>The five that justify the route</b>Göbekli Tepe · Nemrut at sunset · Balıklıgöl at dusk · the Cappadocia balloons · Hagia Sophia</div>';
  const nightNum={thu8:'1',fri9:'2',sat10:'3',sun11:'4',mon12:'5',tue13:'6',wed14:'7',thu15:'8',fri16:'9',sat17:'10',sun18:'✈'};
  days.forEach(d=>{
    const musts=[]; d.slots.forEach(sl=>{ if(sl.p&&sl.p.tier==='m') musts.push(sl.p.name.replace(/,.*$|\(.*$/,'').trim()); });
    h+='<button class="ovday" data-day="'+d.id+'"><i class="ind night pin">'+nightNum[d.id]+'</i><div>';
    h+='<div class="l1"><b>'+esc(d.tab[0])+' · '+esc(d.title)+'</b><small>'+esc(d.sub.split('·')[1]?d.sub.split('·')[1].trim():d.sub)+'</small></div>';
    h+='<div class="l2">'+(d.night?'Sleep: '+esc(d.tab[1]):'Flight 19:00')+(!d.train&&d.route.length>1?' <span class="rt" data-rt="'+d.id+'">'+esc(rtText(d.id))+'</span>':'')+'</div>';
    if(musts.length) h+='<div class="l3">'+musts.map(m=>'<span><i class="ind m"></i>'+esc(m)+'</span>').join('')+'</div>';
    h+='</div></button>';
  });
  h+='<div class="keys"><span><i class="ind m"></i>must-see, the reason the day exists</span><span><i class="ind w"></i>worth it, if the day is on schedule</span><span><i class="ind o"></i>optional, first to drop</span><span><i class="ind w alt"></i>hollow = alternative for the same time slot, any shape</span><span><i class="ind night">3</i>where you sleep that night</span><span><i class="ind town"></i>town you drive through</span><span><i class="ind line"></i>drive, follows real roads when online</span><span><i class="ind line train"></i>train</span></div></div>';
  dayEl.innerHTML=h;
  dayEl.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.day)));
}

let current=null, booted=false;
function select(id){
  const d=id==='overview'?null:days.find(x=>x.id===id); if(id!=='overview'&&!d) return; current=id;
  hotelLayer.clearLayers();
  mapSelect(id);
  tabs.querySelectorAll('.tab').forEach(t=>{const on=t.id==='tab-'+id;t.classList.toggle('active',on);t.setAttribute('aria-selected',on);});
  document.getElementById('tab-'+id)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  if(d) render(d); else renderOverview();
  document.querySelector('.panel').scrollTop=0;
  if(booted&&window.innerWidth<960) document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'});
  try{localStorage.setItem('tr-day',id);}catch(e){}
}
// keyboard: ← → move between days, Esc back to overview
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  const i=days.findIndex(x=>x.id===current);
  if(e.key==='ArrowRight'){ select(i<0?days[0].id:days[Math.min(i+1,days.length-1)].id); }
  else if(e.key==='ArrowLeft'){ if(i>0) select(days[i-1].id); else select('overview'); }
  else if(e.key==='Escape'){ select('overview'); }
});
let start='overview';
// no scroll on first paint
mountSettings(); select(start); booted=true;
</script>
</body>
</html>
