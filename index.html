*,*::before,*::after{box-sizing:inherit}

.legend span{display:inline-flex;align-items:center;gap:6px}

.ind.w{width:11px;height:11px;border-radius:2px;transform:rotate(45deg);border-color:var(--worth);background:var(--worth)}
.ind.o{width:10px;height:10px;border-radius:1.5px;border-color:var(--opt);background:var(--opt)}
.ind.alt{background:var(--panel)!important}
.ind.night{width:16px;height:16px;border-radius:50%;border:2px solid var(--route);background:var(--panel);color:var(--route);font:600 9px/12px var(--sans);text-align:center;transform:none}
.ind.town{width:7px;height:7px;border-radius:50%;border:0;background:#4D5A6A}
.ind.line{width:18px;height:0;border:0;border-top:3px solid var(--route);border-radius:0}
.ind.line.train{border-top-style:dashed}

.nightpin.active{background:var(--route);border-color:var(--route);color:var(--tab-ink);transform:scale(1.12)}
.poipin{box-sizing:border-box;border:2px solid var(--opt);background:var(--opt);box-shadow:0 1px 2px rgba(0,0,0,.35);opacity:.45;transition:opacity .2s,transform .2s}

.ov .keys{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:6px}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.nav button{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13.5px;color:var(--ink)}
.nav button:disabled{opacity:.4;cursor:default}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

   {t:'19:30',p:{n:true,name:'Check in, Fethiye (Paspatur area).'}},
   {t:'20:00',p:{tier:'w',at:'paspatur',name:'Paspatur and the fish market',d:'old quarter; buy fish at the central stall, a restaurant around it grills it for a small fee'},

   {t:'16:00–17:00',p:{tier:'m',at:'demre',name:'Myra, Demre',d:'honeycomb of Lycian rock tombs in a cliff above a Roman theatre; the most dramatic tomb site in Lycia',dur:'45 min'},

           {tier:'o',at:'phaselis',name:'Phaselis',d:'three Roman harbours in a pine forest on the sea; 10 min off route',dur:'45 min',cost:'Antalya at 20:00'}]},
   {t:'19:30',p:{n:true,name:'Check in, Kaleiçi.'}},
   {t:'20:00',p:{tier:'w',at:'kaleici',name:'Kaleiçi',d:'walled Ottoman old town: Hadrian\u2019s Gate (130 AD), the Fluted Minaret, the Roman harbour. Dinner.'}}

{ id:'sat10', stay:"Kızkalesi is small: take a seafront hotel between the two castles so the view is yours at breakfast. Narlıkuyu, 10 min west, is quieter with fish restaurants on the cove.", tab:['Sat 10','Kızkalesi'], title:'Antalya → Kızkalesi, the long coast', sub:'≈ 480 km · 8 h padded · the longest day',

{ id:'sun11', stay:"Stay in the old town around Balıklıgöl, in a konak (restored stone mansion) so the pools and bazaar are a 5-min walk. Karaköprü, the new town 10 min north, has modern hotels but you’d drive in for the evening.", tab:['Sun 11','Şanlıurfa'], title:'Kızkalesi → Şanlıurfa', sub:'≈ 430 km · 6 h padded',
  night:'urfa', route:['kizkalesi','mersin','tarsus','adana','osmaniye','urfa'],
  pois:[['heavenhell','Heaven & Hell','w'],['tarsus','Tarsus','o'],['adana','Adana','w'],['urfa','Urfa','m']],
  deadline:'Urfa museum last entry ~16:30 (assume winter hours). Parked by 16:15, so leave Adana by 13:00 and Kızkalesi at 10:00 sharp.',
  slots:[
   {t:'09:00',p:{tier:'w',at:'kizkalesibeach',name:'Breakfast with Maiden\u2019s Castle',d:'12th-century Armenian castle on an islet 300 m offshore, Korykos Castle on the beach opposite. Swim before breakfast; the beach is at the hotels.'}},
   {t:'10:00',p:{n:true,name:'Leave.'},
     alts:[{tier:'w',at:'heavenhell',name:'Heaven & Hell sinkholes',d:'two huge collapsed caverns 10 min away; steps down into Heaven to a Byzantine chapel at a cave mouth',dur:'1 h',cost:'takes this slot only if you give up the Adana sit-down lunch and eat at a motorway stop'}]},
   {t:'11:45–12:45',p:{tier:'w',at:'taskopru',name:'Adana, kebab lunch',d:'Adana kebab (spicy minced lamb on a flat skewer) with şalgam. Yüzevler, Onbaşılar or Kazancılar. The Roman Taşköprü bridge and the huge Sabancı mosque are a 15-min walk after.',dur:'1 h'},
     alts:[{tier:'o',at:'tarsus',name:'Tarsus',d:'St Paul\u2019s birthplace: Roman Cleopatra\u2019s Gate, St Paul\u2019s well, an Ottoman street; 10 min off the motorway',dur:'45 min',cost:'then a 30-min kebab in Adana'}]},
   {t:'13:00',p:{n:true,name:'O-52 motorway east, 3 h padded. The Gaziantep bypass can jam around 15:00.'}},
   {t:'16:15–17:30',p:{tier:'m',at:'urfa',name:'Şanlıurfa Archaeology Museum',d:'where Göbekli Tepe makes sense: original T-pillars, animal statues, and Urfa Man, the 11,000-year-old oldest life-size human statue found anywhere',dur:'1¼ h'},
     alts:[{tier:'o',at:'urfacastle',name:'Urfa Castle (if the museum is closed)',d:'on the cliff above Balıklıgöl, two Corinthian columns on top, the best view of the old town',dur:'30 min climb'},

   {t:'17:45–19:15',p:{tier:'m',at:'baliklıgol',name:'Balıklıgöl',d:'pools of sacred carp among Ottoman mosques; legend says Nimrod\u2019s fire for Abraham became the water and the embers the fish. Abraham\u2019s cave in the Mevlid-i Halil mosque alongside. Sunset ~18:00; stay until it is lit.'}},
   {t:'19:30',p:{tier:'m',at:'urfabazaar',name:'Urfa bazaar and dinner',d:'coppersmiths, isot pepper, pistachios; tea and backgammon in the Gümrük Han courtyard. Urfa kebab (the mild one), ciğer kebab, şıllık pancakes.'},
     alts:[{tier:'o',at:'urfabazaar',name:'Sıra gecesi',d:'traditional evening of live music and çiğ köfte in a restaurant; instead of a normal dinner, book ahead'}]}
  ],
  buffer:'Buffer 30 min; the tightest day. If the museum is missed it can only be done tomorrow 09:00–10:00 by leaving the hotel at 09:00, otherwise let it go.'},

{ id:'mon12', stay:"Karadut village, the last settlement below the summit (Karadut Pension, Euphrat, Nemrut Kervansaray); basic rooms, dinner included, 30 min from the top. Kâhta town has proper hotels but is 1 h from the summit, which breaks the sunset timing.", tab:['Mon 12','Nemrut'], title:'Göbekli Tepe → Nemrut Dağı', sub:'≈ 190 km · 3 h padded · across the Atatürk Dam lake',
  night:'karadut', route:['urfa','gobekli','hilvan','siverek','nissibi','kahta','karadut','nemrut'], climb:['karadut','nemrutroad','nemrut'], climbMax:230000,
  pois:[['gobekli','Göbekli Tepe','m'],['nemrut','Nemrut','m'],['cendere','Cendere','w'],['karahantepe','Karahantepe','o'],['harran','Harran','o']],
  deadline:'Summit by 17:45 for the 18:05 sunset. Leave Karadut 17:00, arrive Karadut 16:30, leave Siverek by 14:45, leave Göbekli Tepe by 12:45.',
  slots:[
   {t:'10:00',p:{n:true,name:'Leave; the site is 20 min from the centre.'}},
   {t:'10:30–12:30',p:{tier:'m',at:'gobekli',name:'Göbekli Tepe',d:'the oldest monumental site built by humans (c. 9500 BC, 6,000 years before Stonehenge): rings of carved T-pillars with foxes, boars and vultures, raised by hunter-gatherers before farming existed. Roofed excavation, boardwalk, shuttle from the car park. Timed ticket.',dur:'1½–2 h'},
     alts:[{tier:'o',at:'karahantepe',name:'Karahantepe instead',d:'the sister site 1 h southeast: human-figure pillars, newly opened, almost nobody there',dur:'1 h + 2 h driving',cost:'only instead of Göbekli Tepe, never in addition; otherwise Nemrut is impossible'}]},
   {t:'12:30',p:{n:true,name:'Drive north via Hilvan to Siverek, 1 h.'},

   {t:'13:30–14:30',p:{tier:'n',at:'siverek',name:'Lunch in Siverek',d:'market town on the Diyarbakır road; lokantas on the main street, Siverek is known for its lahmacun',dur:'1 h'},
     alts:[{tier:'n',name:'Picnic bought in Urfa, eaten at the Nissibi bridge viewpoint',d:'saves 45 min and buys Arsameia'}]},
   {t:'15:00',p:{tier:'w',at:'nissibi',name:'Nissibi Bridge over the Atatürk Dam lake',d:'cable-stayed bridge (2015) across the drowned Euphrates valley; pull over on the Kâhta side for the view',dur:'10 min'}},
   {t:'15:50',p:{tier:'w',at:'cendere',name:'Cendere Bridge',d:'2nd-century Roman bridge, intact, three of its four columns standing; beside the road',dur:'15 min'},
     alts:[{tier:'o',at:'karakus',name:'Karakuş Tumulus',d:'burial mound of Antiochus\u2019s wife and daughter with an eagle column, 10 min before Cendere',dur:'15 min'},
           {tier:'o',at:'arsameia',name:'Arsameia',d:'Commagene summer capital: relief of Hercules shaking the king\u2019s hand, a long Greek inscription at a tunnel mouth; short climb, 10 min off route',dur:'45 min',cost:'fits only with the picnic option'}]},
   {t:'16:30',p:{n:true,name:'Check in, Karadut guesthouse. Warm layers: the summit is windy and ~5 °C at dusk.'}},
   {t:'17:00',p:{n:true,name:'Drive to the summit car park: 12 km, 30 min, steep paved road with hairpins. Navigate to "Nemrut Dağı Otopark" or "Nemrut Dağı Kafeterya", never to "Mount Nemrut", which routes you 60 km around the north side. Then a 20-min walk up the stone path.'}},
   {t:'18:05',p:{tier:'m',at:'nemrut',name:'Nemrut Dağı sunset, west terrace',d:'South car park, then on foot. Antiochus I\u2019s 1st-century BC tomb: a 50 m gravel tumulus on a 2,134 m summit flanked by 8–9 m seated gods whose toppled heads stare out over the mountains. UNESCO.'}},
   {t:'19:30',p:{n:true,name:'Guesthouse dinner, usually the only option.'}}
  ],
  buffer:'Buffer 40 min. Leaving Göbekli Tepe after 13:15: cut lunch to 30 min. After 13:45: picnic, skip Cendere. The guesthouse feeds you at night, so a thin lunch is survivable.'},

{ id:'tue13', stay:"Stay in the Şahinbey centre around the castle and bazaar (Anadolu Evleri and other stone-house hotels) so dinner and the morning bazaar are on foot. Gazimuhtarpaşa Bulvarı has the modern chains, a 10-min taxi.", tab:['Tue 13','Gaziantep'], title:'Nemrut → the Euphrates → Gaziantep', sub:'≈ 280 km · 4½ h padded · the slack day',

   {t:'16:45',p:{n:true,name:'Check in.'}},

{ id:'wed14', stay:"Göreme centre, on the slope toward Aydınlı, for a cave hotel with a terrace facing the balloons. Uçhisar is the alternative: quieter, the best panorama in Cappadocia, 10 min drive from everything.", tab:['Wed 14','Göreme'], title:'Gaziantep → Cappadocia', sub:'≈ 400 km · 5 h padded',

   {t:'10:00–11:30',p:{tier:'m',at:'zeugmamuseum',name:'Zeugma Mosaic Museum',d:'the largest mosaic museum in the world: Roman villa floors from Zeugma, the Gypsy Girl, the Mars statue',dur:'1½ h'}},

   {t:'13:30–14:30',p:{tier:'n',at:'maras',name:'Lunch in Kahramanmaraş',d:'town centre 10 min off the motorway; chewy Maraş dondurma ice cream for dessert',dur:'1 h'},

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true}).setView([37.6,34.5],6);
const esriAttr='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors, and the GIS User Community';
const streets=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr});
const topo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'});
const otm=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const hosted=location.protocol==='http:'||location.protocol==='https:';
const layers=hosted?{'OpenStreetMap':osm,'Streets (Esri)':streets,'Terrain':topo,'Satellite':sat,'OpenTopoMap':otm}
                   :{'Streets':streets,'Terrain':topo,'Satellite':sat,'OpenTopoMap':otm};
(hosted?osm:streets).addTo(map);
L.control.layers(layers,null,{position:'topright',collapsed:true}).addTo(map);
// if the first tiles fail, fall back to OpenTopoMap automatically
let tileErrors=0;
streets.on('tileerror',()=>{ if(++tileErrors===6&&map.hasLayer(streets)){ map.removeLayer(streets); otm.addTo(map); } });
const LL=k=>{const c=C[k];return [c[1],c[0]];};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const tierName={m:'must-see',w:'worth it',o:'optional',n:''};
const gmPoint=k=>{const c=C[k];return c[1].toFixed(5)+','+c[0].toFixed(5);};
const gmSearch=k=>'https://www.google.com/maps/search/?api=1&query='+gmPoint(k);
function copyText(t,btn){ try{ navigator.clipboard.writeText(t).then(()=>{ if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200);} }); }catch(e){ prompt('Coordinates',t); } }
// which items are included in a day's exported route: ids like 'fri9-2-p' (slot 2 primary) or 'fri9-2-a1' (slot 2, alternative 1)
const chosen={};
function defaultChosen(d){
  if(chosen[d.id]) return chosen[d.id];
  const set=new Set(); d.slots.forEach((sl,i)=>{ if(sl.p&&sl.p.at) set.add(d.id+'-'+i+'-p'); });
  chosen[d.id]=set; return set;
}
function dayEndpoints(d){
  const i=days.indexOf(d);
  const origin=d.id==='thu8'?'ayt':(i>0?days[i-1].night:null);
  const dest=d.night||(d.id==='sun18'?'istanbul':null);
  return {origin,dest};
}
function dayRouteKeys(d,withStops){
  const {origin,dest}=dayEndpoints(d); if(!origin||!dest) return null;
  let keys=[];
  if(withStops){
    const set=defaultChosen(d);
    d.slots.forEach((sl,i)=>{
      if(sl.p&&sl.p.at&&set.has(d.id+'-'+i+'-p')) keys.push({k:sl.p.at,t:sl.p.tier||'n'});
      (sl.alts||[]).forEach((a,j)=>{ if(a.at&&set.has(d.id+'-'+i+'-a'+j)) keys.push({k:a.at,t:a.tier||'n'}); });
    });
  }
  // drop points that are the origin/destination themselves, and consecutive duplicates
  keys=keys.filter(x=>x.k!==origin&&x.k!==dest).filter((x,idx,arr)=>idx===0||arr[idx-1].k!==x.k);
  // Google accepts at most 9 waypoints: drop optional, then worth-it, from the end
  for(const t of ['n','o','w']) while(keys.length>9&&keys.some(x=>x.t===t)){ const idx=keys.map(x=>x.t).lastIndexOf(t); keys.splice(idx,1); }
  while(keys.length>9) keys.pop();
  return {origin,dest,waypoints:keys.map(x=>x.k)};
}
function gmDirections(d,withStops){
  const r=dayRouteKeys(d,withStops); if(!r) return null;
  let u='https://www.google.com/maps/dir/?api=1&origin='+gmPoint(r.origin)+'&destination='+gmPoint(r.dest)+'&travelmode='+(d.id==='sun18'?'walking':'driving');
  if(r.waypoints.length) u+='&waypoints='+r.waypoints.map(gmPoint).join('|');
  return {url:u,n:r.waypoints.length};
}

const legs={}, legLayer=L.layerGroup().addTo(map);
const routed={}; // dayId -> {km, min, note}
const fmtH=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?h+' h '+(m<10?'0':'')+m:m+' min';};
function rtText(id){
  const r=routed[id]; if(!r) return '';
  return Math.round(r.km)+' km · '+fmtH(r.min)+' driving (router)'+(r.note?' '+r.note:'')+' · plan for '+fmtH(r.min*1.2)+' with stops for fuel and traffic';
}
function showRouted(id){
  document.querySelectorAll('[data-rt="'+id+'"]').forEach(el=>{el.textContent=rtText(id);});
}
const nightKeys=new Set(['ayt','fethiye','antalya','kizkalesi','urfa','karadut','gaziantep','goreme','konya','istanbul']);
days.forEach(d=>{
  const pts=d.route.map(LL); if(pts.length<2) return;
  legs[d.id]=L.polyline(pts,{color:'#1E3F8A',weight:3,opacity:.25,dashArray:d.train?'6 8':null,lineJoin:'round'}).addTo(legLayer);
  if(d.train) return;
  // real road geometry from OSRM when online; waypoint line stays as fallback
  const osrm=(keys)=>fetch('https://router.project-osrm.org/route/v1/driving/'+keys.map(k=>C[k][0]+','+C[k][1]).join(';')+'?overview=full&geometries=geojson').then(r=>r.json());
  osrm(d.route).then(j=>{
      const rt=j.routes&&j.routes[0]; if(!rt) return;
      if(d.climbMax&&rt.distance>d.climbMax){
        // the router went round the mountain: route only to the village, draw the climb ourselves
        return osrm(d.route.slice(0,-1)).then(j2=>{
          const r2=j2.routes&&j2.routes[0]; if(!r2) return;
          legs[d.id].setLatLngs(r2.geometry.coordinates.map(c=>[c[1],c[0]])); legs[d.id].setStyle({dashArray:null});
          if(legs[d.id+'-climb']) legs[d.id+'-climb'].addTo(legLayer);
          routed[d.id]={km:r2.distance/1000+12,min:r2.duration/60+30,note:'(incl. 12 km / 30 min summit road)'}; showRouted(d.id);
        });
      }
      legs[d.id].setLatLngs(rt.geometry.coordinates.map(c=>[c[1],c[0]]));
      legs[d.id].setStyle({dashArray:null});
      if(legs[d.id+'-climb']) legLayer.removeLayer(legs[d.id+'-climb']);
      routed[d.id]={km:rt.distance/1000,min:rt.duration/60}; showRouted(d.id);
    }).catch(()=>{ legs[d.id].setStyle({dashArray:'2 6'}); });
});
// mountain climbs the road router can't handle: drawn as their own dashed segment
days.forEach(d=>{
  if(!d.climb) return;
  const pl=L.polyline(d.climb.map(LL),{color:'#1E3F8A',weight:3,opacity:.25,dashArray:'3 6',lineJoin:'round'});
  legs[d.id+'-climb']=pl; // shown only if the router can't reach the car park
});
// intermediate waypoints (route points that are not night stops) as small grey points
const wpLabels={korkuteli:'Korkuteli',kalkan:'Kalkan',finike:'Finike',kumluca:'Kumluca',alanya:'Alanya',anamur:'Anamur',aydincik:'Aydıncık',silifke:'Silifke',mersin:'Mersin',tarsus:'Tarsus',adana:'Adana',osmaniye:'Osmaniye',hilvan:'Hilvan',adiyaman:'Adıyaman',siverek:'Siverek',kahta:'Kâhta',nizip:'Nizip',maras:'Kahramanmaraş',goksun:'Göksun',pinarbasi:'Pınarbaşı',kayseri:'Kayseri',nevsehir:'Nevşehir',aksaray:'Aksaray',eskisehir:'Eskişehir'};
const seen=new Set();
days.forEach(d=>d.route.forEach(k=>{
  if(nightKeys.has(k)||seen.has(k)||!wpLabels[k]) return; seen.add(k);
  L.circleMarker(LL(k),{radius:3.5,stroke:false,fillColor:'#4D5A6A',fillOpacity:.9}).addTo(map).bindTooltip(wpLabels[k],{direction:'top',offset:[0,-4]}).bindPopup('<div class="pp-name">'+wpLabels[k]+'</div><div class="pp-alt">town on the route, no stop planned</div><div class="pp-links"><a target="_blank" rel="noopener" href="'+gmSearch(k)+'">Open in Google Maps</a></div>');
}));

// night stops
const nights=[['ayt','Antalya airport','✈','thu8'],['fethiye','Fethiye','1','thu8'],['antalya','Antalya','2','fri9'],['kizkalesi','Kızkalesi','3','sat10'],['urfa','Şanlıurfa','4','sun11'],['karadut','Karadut / Nemrut','5','mon12'],['gaziantep','Gaziantep','6','tue13'],['goreme','Göreme','7–8','wed14'],['konya','Konya','9','fri16'],['istanbul','Istanbul','10','sat17']];
const stops={};
nights.forEach(([k,label,n,dayId])=>{
  const m=L.marker(LL(k),{icon:L.divIcon({className:'',html:'<div class="nightpin" id="np-'+k+'">'+n+'</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:900,title:label}).addTo(map);
  m.bindTooltip(label,{direction:'top',offset:[0,-14]});
  m.bindPopup('<div class="pp-name">'+label+'</div><div class="pp-alt">night stop</div><div class="pp-links"><a target="_blank" rel="noopener" href="'+gmSearch(k)+'">Open in Google Maps</a><button data-copy="'+gmPoint(k)+'">Copy coordinates</button></div>');
  m.on('click',()=>select(dayId));
  m.on('popupopen',e=>{const c=e.popup.getElement().querySelector('[data-copy]');c&&c.addEventListener('click',()=>copyText(c.dataset.copy,c));});
  stops[k]=m;
});

// every objective, primary and alternative
const poiMarkers=[]; // {day, el, marker}
days.forEach(d=>{
  d.slots.forEach(s=>{
    const items=[[s.p,false]].concat((s.alts||[]).map(a=>[a,true]));
    items.forEach(([it,isAlt])=>{
      if(!it.at||!C[it.at]) return;
      const tier=it.tier&&it.tier!=='n'?it.tier:'o';
      const html='<div class="poipin '+tier+(isAlt?' alt':'')+'" data-day="'+d.id+'"></div>';
      const sz=tier==='m'?15:tier==='w'?12:11;
      const mk=L.marker(LL(it.at),{icon:L.divIcon({className:'',html,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),zIndexOffset:tier==='m'?500:tier==='w'?300:100,title:it.name}).addTo(map);
      let pp='<div class="pp-day">'+esc(d.tab[0])+' · '+esc(s.t)+'</div><div class="pp-name">'+esc(it.name)+(it.tier&&it.tier!=='n'?'<span class="pp-tag '+it.tier+'">'+tierName[it.tier]+(isAlt?', alternative':'')+'</span>':'')+'</div>';
      if(isAlt) pp+='<div class="pp-alt">not in the plan by default; swaps with the primary choice in this slot</div>';
      if(it.d) pp+='<div class="pp-d">'+esc(it.d)+(it.dur?' <span style="color:var(--ink-3)">('+esc(it.dur)+')</span>':'')+'</div>';
      if(it.cost) pp+='<div class="pp-cost">'+esc(it.cost)+'</div>';
      pp+='<div class="pp-links"><a target="_blank" rel="noopener" href="'+gmSearch(it.at)+'">Open in Google Maps</a><button data-copy="'+gmPoint(it.at)+'">Copy coordinates</button><a href="#" data-go="'+d.id+'">Open '+esc(d.tab[0])+' →</a></div>';
      mk.bindPopup(pp);
      mk.on('popupopen',e=>{const el=e.popup.getElement();
        const a=el.querySelector('[data-go]');a&&a.addEventListener('click',ev=>{ev.preventDefault();select(d.id);map.closePopup();});
        const c=el.querySelector('[data-copy]');c&&c.addEventListener('click',()=>copyText(c.dataset.copy,c));});
      poiMarkers.push({day:d.id,marker:mk});
    });
  });
});

function mapSelect(id){
  if(id==='overview'){
    for(const k in legs){ const dd=days.find(x=>x.id===k.replace('-climb','')); legs[k].setStyle({opacity:.85,weight:3.5,color:dd&&dd.train?'#5B6E9E':'#1E3F8A'}); }
    document.querySelectorAll('.poipin').forEach(el=>{el.classList.remove('on');el.classList.toggle('all',el.classList.contains('m')&&!el.classList.contains('alt'));});
    document.querySelectorAll('.nightpin').forEach(el=>el.classList.add('active'));
    const all=[]; for(const k in C) if(nightKeys.has(k)) all.push(LL(k));
    map.fitBounds(L.latLngBounds(all).pad(0.08),{animate:booted});
    return;
  }
  document.querySelectorAll('.poipin').forEach(el=>el.classList.remove('all'));
  const d=days.find(x=>x.id===id);
  for(const k in legs){ const on=(k===id||k===id+'-climb'); legs[k].setStyle({opacity:on?1:.25,weight:on?(k.endsWith('-climb')?4:5):3,color:on?(d.train?'#5B6E9E':'#1E3F8A'):'#1E3F8A'}); }
  document.querySelectorAll('.poipin').forEach(el=>el.classList.toggle('on',el.dataset.day===id));
  document.querySelectorAll('.nightpin').forEach(el=>el.classList.remove('active'));
  const i=days.indexOf(d);
  const on=[]; if(d.night) on.push(d.night); if(i>0&&days[i-1].night) on.push(days[i-1].night);
  if(id==='thu8') on.push('ayt'); if(id==='sun18') on.push('istanbul');
  on.forEach(k=>{const el=document.getElementById('np-'+k);el&&el.classList.add('active');});
  // fit to this day's route + its objectives
  const pts=d.route.concat(d.climb||[]).map(LL).concat(poiMarkers.filter(p=>p.day===id).map(p=>p.marker.getLatLng()));
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(id==='thu15'||id==='sun18'?0.25:0.12),{animate:booted,maxZoom:id==='sun18'?15:13});
}
/* ---------- tabs + panel ---------- */
const tabs=document.getElementById('tabs'), dayEl=document.getElementById('day');
{ const b=document.createElement('button');b.className='tab';b.id='tab-overview';b.setAttribute('role','tab');b.innerHTML='<b>All</b><small>overview</small>';b.addEventListener('click',()=>select('overview'));tabs.appendChild(b); }
days.forEach(d=>{
  const b=document.createElement('button');b.className='tab';b.id='tab-'+d.id;b.setAttribute('role','tab');
  b.innerHTML='<b>'+d.tab[0]+'</b><small>'+d.tab[1]+'</small>';
  b.addEventListener('click',()=>select(d.id));tabs.appendChild(b);
});

function itemHTML(it,alt,incId,checked){
  const tier=it.n?'n':(it.tier||'n');
  let h='<div class="item '+tier+'">';
  if(tier!=='n') h+='<i class="ind '+tier+(alt?' alt':'')+'"></i>';
  h+='<span class="name">'+esc(it.name)+'</span>';
  if(incId&&it.at) h+='<label class="inc" title="Include in the exported Google Maps route"><input type="checkbox" data-inc="'+incId+'" '+(checked?'checked':'')+'> route</label>';
  if(it.dur) h+='<span class="dur">'+esc(it.dur)+'</span>';
  if(it.d) h+='<div class="d">'+esc(it.d)+'</div>';
  if(alt&&it.cost) h+='<span class="cost">'+esc(it.cost)+'</span>';
  return h+'</div>';
}
function render(d){
  const i=days.indexOf(d);
  let h='<div class="daynav"><button class="back" data-ov>← Overview</button><span>Day '+(i+1)+' of '+days.length+'</span><span><button data-prev '+(i===0?'disabled':'')+' aria-label="Previous day">‹</button> <button data-next '+(i===days.length-1?'disabled':'')+' aria-label="Next day">›</button></span></div>';
  h+='<h2>'+esc(d.title)+'</h2><p class="sub">'+esc(d.sub)+'</p>';
  if(!d.train&&d.route.length>1) h+='<p class="rt" data-rt="'+d.id+'">'+esc(rtText(d.id)||'Measuring the route…')+'</p>';
  if(d.stay) h+='<p class="stay">'+esc(d.stay)+'</p>';
  h+='<div class="deadline"><b>Hard deadline.</b> '+esc(d.deadline)+'</div>';
  d.slots.forEach(s=>{
    const set=defaultChosen(d), si=d.slots.indexOf(s);
    h+='<div class="slot"><div class="t">'+esc(s.t)+'</div><div>'+itemHTML(s.p,false,d.id+'-'+si+'-p',set.has(d.id+'-'+si+'-p'));
    if(s.alts&&s.alts.length){
      h+='<details class="alts"><summary>'+(s.alts.length===1?'1 alternative':s.alts.length+' alternatives')+'</summary>';
      s.alts.forEach((a,j)=>h+=itemHTML(a,true,d.id+'-'+si+'-a'+j,set.has(d.id+'-'+si+'-a'+j)));
      h+='</details>';
    }
    h+='</div></div>';
  });
  if(d.buffer) h+='<div class="buffer">'+esc(d.buffer)+'</div>';
  h+=gmBlock(d);
  h+='<div class="nav"><button id="prev" '+(i===0?'disabled':'')+'>← '+(i>0?esc(days[i-1].tab[0]):'')+'</button><button id="next" '+(i===days.length-1?'disabled':'')+'>'+(i<days.length-1?esc(days[i+1].tab[0]):'')+' →</button></div>';
  dayEl.innerHTML=h;
  dayEl.querySelector('#prev')?.addEventListener('click',()=>select(days[i-1].id));
  dayEl.querySelector('#next')?.addEventListener('click',()=>select(days[i+1].id));
  dayEl.querySelector('[data-prev]')?.addEventListener('click',()=>select(days[i-1].id));
  dayEl.querySelector('[data-next]')?.addEventListener('click',()=>select(days[i+1].id));
  dayEl.querySelector('[data-ov]')?.addEventListener('click',()=>select('overview'));
  dayEl.querySelectorAll('[data-inc]').forEach(cb=>cb.addEventListener('change',()=>{
    const set=defaultChosen(d); cb.checked?set.add(cb.dataset.inc):set.delete(cb.dataset.inc); refreshGm(d);
  }));
}

function gmBlock(d){
  if(d.train) return '';
  const a=gmDirections(d,true), b=gmDirections(d,false); if(!a) return '';
  const {origin,dest}=dayEndpoints(d);
  return '<div class="gm" id="gm"><span class="lbl">Send today to Google Maps</span>'
    +'<a class="primary" target="_blank" rel="noopener" href="'+a.url+'">Route with the ticked stops ('+a.n+')</a>'
    +'<a target="_blank" rel="noopener" href="'+b.url+'">Direct, no stops</a>'
    +'<small>Opens the Google Maps app with the stops in order as coordinate pins; tick or untick "route" next to any item above to change what is sent. Google allows 9 stops, so optional ones are dropped first.</small></div>';
}
function refreshGm(d){ const el=document.getElementById('gm'); if(!el) return; el.outerHTML=gmBlock(d); }
function renderOverview(){
  let h='<div class="ov"><h2>Turkey by car, 10 nights</h2><p class="sub">Antalya to Istanbul the long way: the Lycian coast, Göbekli Tepe, Nemrut, Gaziantep, Cappadocia, Konya, then the train. About 2,100 km. Tap a day.</p>';
  h+='<div class="top5"><b>The five that justify the route</b>Göbekli Tepe · Nemrut at sunset · Balıklıgöl at dusk · the Cappadocia balloons · Hagia Sophia</div>';
  const nightNum={thu8:'1',fri9:'2',sat10:'3',sun11:'4',mon12:'5',tue13:'6',wed14:'7',thu15:'8',fri16:'9',sat17:'10',sun18:'✈'};
  days.forEach(d=>{
    const musts=[]; d.slots.forEach(sl=>{ if(sl.p&&sl.p.tier==='m') musts.push(sl.p.name.replace(/,.*$|\(.*$/,'').trim()); });
    h+='<button class="ovday" data-day="'+d.id+'"><i class="ind night pin">'+nightNum[d.id]+'</i><div>';
    h+='<div class="l1"><b>'+esc(d.tab[0])+' · '+esc(d.title)+'</b><small>'+esc(d.sub.split('·')[1]?d.sub.split('·')[1].trim():d.sub)+'</small></div>';
    h+='<div class="l2">'+(d.night?'Sleep: '+esc(d.tab[1]):'Flight 19:00')+(!d.train&&d.route.length>1?' <span class="rt" data-rt="'+d.id+'">'+esc(rtText(d.id))+'</span>':'')+'</div>';
    if(musts.length) h+='<div class="l3">'+musts.map(m=>'<span><i class="ind m"></i>'+esc(m)+'</span>').join('')+'</div>';
    h+='</div></button>';
  });
  h+='<div class="keys"><span><i class="ind m"></i>must-see, the reason the day exists</span><span><i class="ind w"></i>worth it, if the day is on schedule</span><span><i class="ind o"></i>optional, first to drop</span><span><i class="ind w alt"></i>hollow = alternative for the same time slot, any shape</span><span><i class="ind night">3</i>where you sleep that night</span><span><i class="ind town"></i>town you drive through</span><span><i class="ind line"></i>drive, follows real roads when online</span><span><i class="ind line train"></i>train</span></div></div>';
  dayEl.innerHTML=h;
  dayEl.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.day)));
}

let current=null, booted=false;
function select(id){
  const d=id==='overview'?null:days.find(x=>x.id===id); if(id!=='overview'&&!d) return; current=id;
  mapSelect(id);
  tabs.querySelectorAll('.tab').forEach(t=>{const on=t.id==='tab-'+id;t.classList.toggle('active',on);t.setAttribute('aria-selected',on);});
  document.getElementById('tab-'+id)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  if(d) render(d); else renderOverview();
  document.querySelector('.panel').scrollTop=0;
  if(booted&&window.innerWidth<960) document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'});
  try{localStorage.setItem('tr-day',id);}catch(e){}
}
// keyboard: ← → move between days, Esc back to overview
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  const i=days.findIndex(x=>x.id===current);
  if(e.key==='ArrowRight'){ select(i<0?days[0].id:days[Math.min(i+1,days.length-1)].id); }
  else if(e.key==='ArrowLeft'){ if(i>0) select(days[i-1].id); else select('overview'); }
  else if(e.key==='Escape'){ select('overview'); }
});
let start='overview';
// no scroll on first paint
select(start); booted=true;
</script>
</body>
